services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env}
      ADMIN_AUTH_SHA256: ${ADMIN_AUTH_SHA256:-}
    volumes:
      - attempts:/app/data
  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  attempts:
  caddy_data:
  caddy_config:
